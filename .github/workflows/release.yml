name: Release NovaFlow
run-name: Release NovaFlow ${{ github.event_name == 'push' && github.ref_name || (startsWith(inputs.version, 'v') && inputs.version || format('v{0}', inputs.version)) }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 发布版本号（X.Y.Z）
        type: string
        required: true
      ref:
        description: 留空使用当前选择的版本；签名构建要求与所选工作流版本为同一提交
        type: string

permissions:
  contents: read

concurrency:
  group: toonflow-release
  cancel-in-progress: false

jobs:
  build:
    name: 构建所有平台版本
    uses: ./.github/workflows/debug.yml
    with:
      target: desktopClients
      ref: ${{ inputs.ref || github.sha }}
      version: ${{ inputs.version || github.ref_name }}
      generatePatch: false
    secrets:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_NOTARIZATION_KEY_ID: ${{ secrets.MACOS_NOTARIZATION_KEY_ID }}
      MACOS_NOTARIZATION_ISSUER_ID: ${{ secrets.MACOS_NOTARIZATION_ISSUER_ID }}
      MACOS_NOTARIZATION_KEY_BASE64: ${{ secrets.MACOS_NOTARIZATION_KEY_BASE64 }}

  release:
    name: 发布 GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 校验已有版本标签
        env:
          GH_TOKEN: ${{ github.token }}
          releaseVersion: ${{ needs.build.outputs.version }}
          buildCommit: ${{ needs.build.outputs.commit }}
        run: |
          node --input-type=module <<'JS'
          const tag = `refs/tags/v${process.env.releaseVersion}`;
          const api = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}`;
          const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: "application/vnd.github+json" };
          let response = await fetch(`${api}/git/ref/tags/v${process.env.releaseVersion}`, {
            headers,
            signal: AbortSignal.timeout(30000),
          });
          if (response.status !== 404) {
            if (!response.ok) throw new Error(`读取版本标签失败（HTTP ${response.status}）`);
            let { object } = await response.json();
            while (object.type === "tag") {
              response = await fetch(`${api}/git/tags/${object.sha}`, { headers, signal: AbortSignal.timeout(30000) });
              if (!response.ok) throw new Error(`解析版本标签失败（HTTP ${response.status}）`);
              ({ object } = await response.json());
            }
            if (object.type !== "commit" || object.sha !== process.env.buildCommit) throw new Error(`${tag} 与构建提交不一致，请使用新版本号或选择该标签对应的代码。`);
          }
          JS
      - name: 下载各平台产物
        uses: actions/download-artifact@v8
        with:
          pattern: toonflow-${{ needs.build.outputs.version }}-*
          path: artifacts
          merge-multiple: true
      - name: 生成下载说明与校验值
        env:
          releaseVersion: ${{ needs.build.outputs.version }}
        run: |
          node --input-type=module <<'JS'
          import { readdirSync, readFileSync, writeFileSync } from "node:fs";
          import { createHash } from "node:crypto";
          const files = readdirSync("artifacts").sort();
          const version = process.env.releaseVersion;
          const windows = `novaFlowCreator-${version}-win-x64-setup.exe`;
          const mac = `novaFlowCreator-${version}-macos-arm64.dmg`;
          for (const file of [windows, mac, "stable-win-x64-update.json", "stable-macos-arm64-update.json"]) {
            if (!files.includes(file)) throw new Error(`缺少发行文件：${file}`);
          }
          const base = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/releases/download/v${version}`;
          writeFileSync("releaseBody.md", [
            `NovaFlow 创作工作台 ${version}`,
            "",
            "| 系统 | 安装包 |",
            "| --- | --- |",
            `| macOS Apple Silicon（ARM64） | [下载 DMG](${base}/${mac}) |`,
            `| Windows Intel / AMD（x64） | [下载安装程序](${base}/${windows}) |`,
            "",
            "Mac：将应用拖入应用程序目录。未配置 Developer ID 证书时使用临时签名，首次打开可能需要用户授权。",
            "Windows：运行安装程序。未配置 Windows 代码签名证书时，可能出现未知发布者或 SmartScreen 提示。",
            "",
            `[安装与签名说明](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}#macos-安装与签名)`,
          ].join("\n"));
          writeFileSync("artifacts/sha256.txt", files.map(name =>
            `${createHash("sha256").update(readFileSync(`artifacts/${name}`)).digest("hex")}  ${name}`
          ).join("\n") + "\n");
          JS
      - name: 发布两个平台安装包及更新文件
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ needs.build.outputs.commit }}
          name: NovaFlow 创作工作台 ${{ needs.build.outputs.version }}
          make_latest: true
          body_path: releaseBody.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
